version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
    groups:
      # Patch is its own group because fetch-metadata reports the highest bump in a pull request:
      # a single minor update in a mixed pull request would keep auto-merge from ever firing.
      npm-patch:
        patterns:
          - '*'
        update-types:
          - patch
      npm-minor-and-major:
        patterns:
          - '*'
        update-types:
          - minor
          - major

  - package-ecosystem: github-actions
    # A bare `/` covers .github/workflows and a root action.yml only, so the composite actions
    # under .github/actions need their own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    groups:
      actions-patch:
        patterns:
          - '*'
        update-types:
          - patch
      actions-minor-and-major:
        patterns:
          - '*'
        update-types:
          - minor
          - major
