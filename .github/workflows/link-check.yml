name: Link check

# Weekly and on demand only — never on a pull request. A third-party outage is not a reason to
# block a merge, and a failed scheduled run is the signal.
# GitHub disables scheduled workflows after 60 days without repository activity; if no weekly run
# appears, re-enable it in the Actions tab.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      # The built HTML, not the templates: that is where the real hrefs of both locales are.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check every link in the built output
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --base-url dist/website/browser --format json --output lychee-report.json 'dist/website/browser/**/*.html'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # A green run over zero external URLs would be indistinguishable from a green run over all
      # of them, so the report has to name every destination the copy actually links to.
      - name: Every external destination was requested
        if: always()
        run: |
          missing=0
          for host in github.com discord.gg youtube.com ko-fi.com patreon.com lehrgrapht.de bugaball.com dg-datenschutz.de wbs.legal; do
            if ! grep -q "$host" lychee-report.json; then
              echo "::error::$host was never checked"
              missing=1
            fi
          done
          exit $missing
