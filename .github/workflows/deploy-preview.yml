name: Deploy Preview

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    # Neither a fork's pull request nor Dependabot's can reach the secrets, so neither gets a
    # preview. Skipping beats failing on the token step; pull_request_target would build foreign
    # code with the secrets in reach.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/publish.yml
    with:
      environment: preview
      # No ref: on a pull request that leaves the checkout on the merge commit the preview is
      # meant to show, and a manual run builds the default branch.
      url: https://preview.boundfoxstudios.com
      branch: deployment/preview
      # lastmod stays off: the database belongs to the production sitemap, and feeding it from
      # throwaway preview builds would date the live URLs from commits that never shipped.
    secrets: inherit
