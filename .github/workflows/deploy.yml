name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://boundfoxstudios.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm run fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx ng build
      - run: npm run postbuild
      - name: Publish to the build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth 1 origin build
          git worktree add published -B build FETCH_HEAD
          rsync --archive --delete --exclude .git dist/website/browser/ published/
          git -C published add --all
          if git -C published diff --cached --quiet; then
            echo "build output unchanged, nothing to publish"
          else
            git -C published commit -m "chore: publish ${GITHUB_SHA}"
            git -C published push origin build
          fi
