name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/publish.yml
    with:
      environment: production
      url: https://boundfoxstudios.com
      branch: deployment/production
      ref: main
      lastmod: true
      purge-edge-cache: true
    secrets: inherit
