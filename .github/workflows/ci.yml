name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cve-check:
    name: CVE check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: OWASP/cve-lite-cli@fd481fff75f492f94de36dcaf020674af0eca9ef # v1.29.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          fail-on: 'critical'
          verbose: 'true'

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm run format:check
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Count tracked specs
        id: specs
        run: echo "count=$(git ls-files '*.spec.ts' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
        if: steps.specs.outputs.count != '0'
      - uses: ./.github/actions/prepare-node
        if: steps.specs.outputs.count != '0'
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm test
        if: steps.specs.outputs.count != '0'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm run i18n:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nothing is measured
        run: |
          if grep -rniE 'cloudflareinsights|beacon\.min\.js|googletagmanager|google-analytics|plausible\.io|matomo' dist/website/browser; then
            echo "::error::an analytics script reached the build"
            exit 1
          fi
      - run: npm run lighthouse
      - run: npx playwright install chromium
      - run: npm run axe
