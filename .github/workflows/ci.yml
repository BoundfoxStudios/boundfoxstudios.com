name: CI

# No paths filter on purpose: a filtered-out run never reports, and a required
# status check then waits forever.
on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cve-check:
    name: CVE check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: OWASP/cve-lite-cli@fd481fff75f492f94de36dcaf020674af0eca9ef # v1.29.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          fail-on: 'critical'
          verbose: 'true'

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm run format:check
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `ng test` exits 1 with "No tests found matching the following patterns"
      # while the repository tracks no spec, which would make this required check
      # red by construction until the first spec lands.
      - name: Count tracked specs
        id: specs
        run: echo "count=$(git ls-files '*.spec.ts' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
        if: steps.specs.outputs.count != '0'
      - uses: ./.github/actions/prepare-node
        if: steps.specs.outputs.count != '0'
        with:
          version: ${{ steps.node-version.outputs.version }}
      - run: npm test
        if: steps.specs.outputs.count != '0'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/read-node-version-from-nvmrc
        id: node-version
      - uses: ./.github/actions/prepare-node
        with:
          version: ${{ steps.node-version.outputs.version }}
      # Re-extracting must not change either catalogue: a forgotten `npm run i18n:extract` or an
      # orphaned unit shows up as a dirty tree. `verify:translations` then covers what the builder
      # cannot — a unit that exists without a `<target>` resolves to its German `<source>` and
      # would otherwise ship German into /en/ with a green build.
      - run: npm run i18n:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The `prebuild` hook fetches the GitHub data, so this is a single step and never fetches twice.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
