<!-- One slot for both densities: a second <ng-content> with the same selector never receives content. -->
<ng-template #links><ng-content select="[card-links]" /></ng-template>

<article
  class="flex flex-col overflow-hidden rounded-xl border border-neutral-200 bg-white shadow-md"
>
  <div [class]="mediaPanelClass()">
    <ng-content select="[card-media]" />
  </div>
  <div class="flex flex-1 flex-col gap-2 p-6">
    <div class="flex items-center gap-2.5">
      <bfs-kicker variant="inline">{{ kicker() }}</bfs-kicker>
      <ng-content select="[card-badge]" />
    </div>
    @if (headingLevel() === 2) {
      <h2
        class="m-0 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        {{ title() }}
      </h2>
    } @else {
      <h3
        class="m-0 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        {{ title() }}
      </h3>
    }
    <p class="m-0 text-sm leading-relaxed"><ng-content /></p>
    @if (density() === 'roomy') {
      <div class="mt-auto flex flex-wrap items-center justify-between gap-3 pt-2">
        <span class="text-xs text-neutral-600">{{ platformsLine() }}</span>
        <ng-container [ngTemplateOutlet]="links" />
      </div>
    } @else {
      <span class="text-xs text-neutral-600">{{ platformsLine() }}</span>
      <div class="mt-auto flex flex-wrap gap-4 pt-3">
        <ng-container [ngTemplateOutlet]="links" />
      </div>
    }
  </div>
</article>
