<div class="flex flex-col overflow-hidden rounded-xl border border-neutral-200 bg-white shadow-md">
  <div class="flex-1 p-6">
    @if (eyebrow(); as eyebrowText) {
      <div class="mb-1.5 text-xs font-bold tracking-widest text-orange uppercase">
        {{ eyebrowText }}
      </div>
    }
    @if (headingLevel() === 2) {
      <h2
        class="mb-2 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        {{ title() }}
      </h2>
    } @else {
      <h3
        class="mb-2 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        {{ title() }}
      </h3>
    }
    <div class="text-sm leading-relaxed text-neutral-700"><ng-content /></div>
  </div>
  @if (hasFooter()) {
    <div class="border-t border-neutral-200 bg-neutral-100 px-6 py-3 text-xs text-neutral-600">
      <ng-content select="[card-footer]" />
    </div>
  }
</div>
