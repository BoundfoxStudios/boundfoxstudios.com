<!-- One slot for both heading levels: the title never renders twice. -->
<ng-template #titleLabel>
  @if (href(); as target) {
    <!-- The pseudo-element stretches the anchor over the whole card, so the entire surface is
         clickable without wrapping the footer inside the link. -->
    <a
      class="text-neutral-900 focus-ring after:absolute after:inset-0 hover:text-orange"
      [href]="target"
      [attr.aria-label]="linkAriaLabel()"
      target="_blank"
      rel="noopener noreferrer"
      >{{ title() }}</a
    >
  } @else {
    {{ title() }}
  }
</ng-template>

<div [class]="containerClass()">
  <div class="flex-1 p-6">
    @if (eyebrow(); as eyebrowText) {
      <div
        class="mb-1.5 text-xs font-bold tracking-widest text-orange uppercase"
        data-a11y-exception="kicker-contrast"
      >
        {{ eyebrowText }}
      </div>
    }
    @if (headingLevel() === 2) {
      <h2
        class="mb-2 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        <ng-container [ngTemplateOutlet]="titleLabel" />
      </h2>
    } @else {
      <h3
        class="mb-2 font-display text-2xl leading-none tracking-wide text-neutral-900 uppercase"
        translate="no"
      >
        <ng-container [ngTemplateOutlet]="titleLabel" />
      </h3>
    }
    <div class="text-sm leading-relaxed text-neutral-700"><ng-content /></div>
  </div>
  @if (hasFooter()) {
    <div class="border-t border-neutral-200 bg-neutral-100 px-6 py-3 text-xs text-neutral-600">
      <ng-content select="[card-footer]" />
    </div>
  }
</div>
