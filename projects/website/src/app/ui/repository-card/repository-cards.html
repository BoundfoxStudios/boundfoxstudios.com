<!-- Four authored elements in the fixed order LehrGrapht → MAT → Flugwacht → Flutter SDK Sync
     Companion, never a sorted @for: the order is an editorial decision, not a function of
     pushedAt. -->
<div class="grid grid-cols-[repeat(auto-fit,minmax(min(280px,100%),1fr))] gap-6">
  <bfs-repository-card
    [language]="lehrgrapht.language"
    [version]="versions.lehrgrapht"
    [updatedAt]="lehrgrapht.pushedAt"
    [href]="lehrgraphtRepository"
    title="LehrGrapht"
    description="Mathe-Plotter-Word-AddIn für Lehrkräfte — maßstabsgetreu auf 5×5-mm-Karopapier."
    i18n-description="@@home.github.lehrgrapht.description"
  />
  <bfs-repository-card
    [language]="mat.language"
    [version]="versions.mat"
    [updatedAt]="mat.pushedAt"
    [href]="matRepository"
    title="MAT"
    description="Markdown-Vorschau im Browser, gerendert wie auf GitHub — direkt aus dem Terminal."
    i18n-description="@@home.github.mat.description"
  />
  <bfs-repository-card
    [language]="flugwacht.language"
    [version]="versions.flugwacht"
    [updatedAt]="flugwacht.pushedAt"
    [href]="flugwachtRepository"
    title="Flugwacht"
    description="Minimaler Flug-Tracker für einzelne, manuell angelegte Flüge — live auf der Karte."
    i18n-description="@@home.github.flugwacht.description"
  />
  <bfs-repository-card
    [language]="flutterSdkSyncCompanion.language"
    [version]="versions.flutterSdkSyncCompanion"
    [updatedAt]="flutterSdkSyncCompanion.pushedAt"
    [href]="flutterSdkSyncCompanionRepository"
    title="Flutter SDK Sync Companion"
    description="IntelliJ-Plugin, das die Flutter-SDK-Auswahl eines Projekts mit FVM synchron hält."
    i18n-description="@@home.github.flutter-sdk-sync-companion.description"
  />
</div>
