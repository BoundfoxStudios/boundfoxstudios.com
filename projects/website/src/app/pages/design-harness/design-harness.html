<section class="mx-auto max-w-6xl px-6 py-16">
  <h1 class="font-display text-4xl tracking-wide text-neutral-900 uppercase">Design harness</h1>

  <h2 class="mt-10 font-display text-2xl tracking-wide text-neutral-900 uppercase">Marks</h2>
  <div class="mt-4 flex items-center gap-6 bg-neutral-900 p-4">
    <img
      ngSrc="images/fox-head-64.webp"
      width="32"
      height="32"
      alt=""
      priority
    />
    <img
      ngSrc="images/fox-head-80.webp"
      width="40"
      height="40"
      alt=""
    />
  </div>

  <h2 class="mt-10 font-display text-2xl tracking-wide text-neutral-900 uppercase">App artwork</h2>
  <div class="mt-4 flex flex-wrap items-center gap-6">
    <img
      ngSrc="images/mat-dark.svg"
      width="112"
      height="112"
      alt=""
    />
    <img
      class="h-auto w-[56%] max-w-[300px]"
      ngSrc="images/flugwacht-wordmark.svg"
      width="231"
      height="42"
      alt=""
    />
  </div>

  <h2 class="mt-10 font-display text-2xl tracking-wide text-neutral-900 uppercase">Brand icons</h2>

  @for (size of brandIconSizes; track size) {
    <div class="mt-4 flex flex-wrap items-center gap-6 text-neutral-900">
      <span class="font-mono text-xs">{{ size }}</span>
      @for (name of brandIconNames; track name) {
        <bfs-brand-icon
          [name]="name"
          [size]="size"
        />
      }
    </div>
  }

  <div class="mt-4 flex flex-wrap items-center gap-6 bg-neutral-900 p-6 text-white">
    @for (name of brandIconNames; track name) {
      <bfs-brand-icon
        [name]="name"
        [size]="32"
      />
    }
  </div>

  <div class="mt-4 flex flex-wrap items-center gap-6 bg-neutral-900 p-6 text-yellow">
    @for (name of brandIconNames; track name) {
      <bfs-brand-icon
        [name]="name"
        [size]="32"
      />
    }
  </div>

  <div class="mt-4 flex flex-wrap items-center gap-6 text-neutral-900">
    <bfs-brand-icon
      [size]="200"
      name="discord"
    />
    <bfs-brand-icon
      [size]="200"
      name="youtube"
    />
  </div>
</section>
