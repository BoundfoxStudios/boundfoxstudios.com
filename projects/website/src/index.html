<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Website</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="48x48"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <!-- Icons are absolute: one copy at the site root serves both locales. The manifest is
         relative on purpose, so `<base href="/en/">` resolves it to the English one. -->
    <link
      rel="manifest"
      href="manifest.webmanifest"
    />
    <meta
      name="theme-color"
      content="#171717"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bebas-neue-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-400.woff2"
      crossorigin
    />
  </head>
  <body>
    <bfs-root></bfs-root>
  </body>
</html>
